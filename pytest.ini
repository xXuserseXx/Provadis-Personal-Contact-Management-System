# pytest.ini
[pytest]
testpaths = tests
# This is just such that we can run the
# tests from the root of our project.

# This is to configure the inbuild logging of pytest that was used for debugging:
log_file = pytest.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S